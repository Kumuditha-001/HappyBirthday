<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Senu...</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: manipulation;
            position: relative;
        }

        /* 1. සෙමින් චලනය වන පාවෙන පසුබිම් ස්තරය */
        .animated-bg {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110vw;
            height: 110vh;
            background-image: url('1.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: -2;
            animation: breatheBg 14s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes breatheBg {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.05) translate(-1.2%, 0.8%); }
            100% { transform: scale(1.03) translate(1.2%, -0.8%); }
        }

        /* 2. පසුබිමේ පාවෙන දිලිසෙන අංශු */
        .ambient-sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .sparkle-dot {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 105, 180, 0.5) 60%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: floatSparkle 6s ease-in-out forwards;
        }

        @keyframes floatSparkle {
            0% { opacity: 0; transform: translateY(0) scale(0.4); }
            30% { opacity: 0.8; }
            70% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        /* Screen එක දෙදරන (Shake) Animation එක */
        .shake-screen {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 8px); }
            40% { transform: translate(10px, -8px); }
            60% { transform: translate(-8px, 6px); }
            80% { transform: translate(8px, -6px); }
            100% { transform: translate(0, 0); }
        }

        /* Heart Transition Fullscreen Overlay */
        .page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
            overflow: hidden;
        }

        .transition-heart {
            position: absolute;
            bottom: -70px;
            user-select: none;
            animation: burstUpSlow 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes burstUpSlow {
            0% { transform: translateY(0) scale(0.6); opacity: 0.2; }
            25% { opacity: 1; }
            100% { transform: translateY(-125vh) scale(2.6); opacity: 1; }
        }

        /* 3. මැද ඇති Photo එක සඳහා "Click Me" Attention / Wobble Animation එක */
        .image-btn {
            width: 85px;
            height: 85px;
            cursor: pointer;
            object-fit: cover;
            display: block;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
            z-index: 10;
            animation: clickMeWobble 2.6s infinite ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes clickMeWobble {
            0%, 100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            15% {
                transform: translateY(-8px) scale(1.08) rotate(-4deg);
            }
            25% {
                transform: translateY(-8px) scale(1.08) rotate(4deg);
            }
            35% {
                transform: translateY(-4px) scale(1.04) rotate(-2deg);
            }
            45% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            70% {
                transform: scale(1.06);
                filter: drop-shadow(0 8px 18px rgba(255, 51, 102, 0.6));
            }
            80% {
                transform: scale(1);
                filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
            }
        }

        .image-btn:hover {
            animation-play-state: paused;
            transform: scale(1.15);
        }

        /* Popup පසුබිම */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Transparent Glass Mini Tab */
        .modal-content {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            width: 85%;
            max-width: 320px;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #ff4d4d;
        }

        .modal-content h2 {
            margin-top: 5px;
            margin-bottom: 12px;
            font-size: 20px;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .modal-content p {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .btn-yes {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes:hover {
            background-color: #e62055;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: rgba(255, 255, 255, 0.25);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            transition: background-color 0.2s;
            z-index: 1100;
        }
    </style>
</head>

<body id="pageBody">

    <!-- සෙමින් චලනය වන පසුබිම -->
    <div class="animated-bg"></div>

    <!-- දිලිසෙන අංශු ස්තරය -->
    <div class="ambient-sparkles" id="ambientSparkles"></div>

    <!-- අඛණ්ඩ පසුබිම් සංගීතය -->
    <audio id="bgMusic" src="H music.mp3" preload="auto" loop></audio>

    <!-- Transition Hearts සඳහා Overlay එක -->
    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <!-- සෙලවෙමින් "මාව click කරන්න" යැයි අඟවන Main Image Button එක -->
    <img src="m1.png" alt="Click Me" class="image-btn" onclick="openMiniTab()">

    <!-- Open වන Transparent Mini Tab එක -->
    <div id="miniTab" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeMiniTab()">&times;</span>

            <h2>ආ... සෙනූ මැණික,<br>ඔයා මට ආදරෙයිද? ❤️</h2>
            <p>ඔයා වෙනුවෙන් ලොකු දෙයක් ලෑස්ති කරලා තියෙනවා...</p>
            
            <div class="btn-group">
                <button class="btn-yes" onclick="goToNextPage()">ඔව් ආදරෙයි</button>
                <button class="btn-no" id="noBtn" onclick="handleNoClick()">නැ ආදරේ නැ</button>
            </div>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        window.addEventListener('DOMContentLoaded', () => {
            const savedTime = localStorage.getItem('musicCurrentTime');
            if (savedTime) bgMusic.currentTime = parseFloat(savedTime);

            if (localStorage.getItem('musicPlaying') === 'true') {
                bgMusic.play().catch(() => {});
            }

            startSparkleEffect();
        });

        bgMusic.addEventListener('timeupdate', () => {
            localStorage.setItem('musicCurrentTime', bgMusic.currentTime);
        });

        function ensureMusicPlaying() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    localStorage.setItem('musicPlaying', 'true');
                }).catch(() => {});
            }
        }

        function startSparkleEffect() {
            const sparklesContainer = document.getElementById('ambientSparkles');

            setInterval(() => {
                const dot = document.createElement('div');
                dot.classList.add('sparkle-dot');

                const size = Math.random() * 8 + 5;
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';
                dot.style.left = Math.random() * 100 + 'vw';
                dot.style.top = Math.random() * 95 + 'vh';
                dot.style.animationDuration = (Math.random() * 3 + 4) + 's';

                sparklesContainer.appendChild(dot);

                setTimeout(() => {
                    dot.remove();
                }, 7000);
            }, 750);
        }

        const funnyMessages = [
            "නෑ ඔයා බොරු!",
            "ඔයා බොරු කියන්නේ 😜",
            "දැන් බොරු කිව්වා ඇති නේද? 🙄",
            "ඔව් ආදරෙයි කියලා ඔබන්නකෝ! ❤️",
            "අල්ලන්න බෑ නේද? 😝",
            "ආදරෙයි කියලා මම දන්නවා! 🥰",
            "මාව රවට්ටන්න බෑ මැණික 🙈"
        ];

        function openMiniTab() {
            ensureMusicPlaying();
            document.getElementById("miniTab").style.display = "flex";
            resetNoButton();
        }

        function closeMiniTab() {
            document.getElementById("miniTab").style.display = "none";
            resetNoButton();
        }

        function goToNextPage() {
            ensureMusicPlaying();
            localStorage.setItem('musicCurrentTime', bgMusic.currentTime);
            localStorage.setItem('musicPlaying', 'true');

            const transitionOverlay = document.getElementById('transitionOverlay');
            const heartIcons = ['❤️', '💖', '💕', '💓', '💗'];
            const totalBurstHearts = 65;

            for (let i = 0; i < totalBurstHearts; i++) {
                const tHeart = document.createElement('div');
                tHeart.classList.add('transition-heart');
                tHeart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                tHeart.style.left = (Math.random() * 100) + 'vw';
                tHeart.style.fontSize = (Math.random() * 32 + 24) + 'px';
                tHeart.style.animationDelay = (Math.random() * 0.5) + 's';
                tHeart.style.animationDuration = (Math.random() * 0.4 + 1.2) + 's';
                transitionOverlay.appendChild(tHeart);
            }

            setTimeout(() => {
                window.location.href = "02.html";
            }, 1400);
        }

        function handleNoClick() {
            ensureMusicPlaying();
            const body = document.getElementById("pageBody");
            const noBtn = document.getElementById("noBtn");

            body.classList.remove("shake-screen");
            void body.offsetWidth;
            body.classList.add("shake-screen");

            const randomIndex = Math.floor(Math.random() * funnyMessages.length);
            noBtn.innerText = funnyMessages[randomIndex];

            noBtn.style.position = "fixed";

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        }

        function resetNoButton() {
            const noBtn = document.getElementById("noBtn");
            noBtn.style.position = "static";
            noBtn.style.left = "auto";
            noBtn.style.top = "auto";
            noBtn.innerText = "නැ ආදරේ නැ";
        }

        window.onclick = function(event) {
            const modal = document.getElementById("miniTab");
            if (event.target === modal) {
                closeMiniTab();
            }
        };
    </script>

</body>
</html>
