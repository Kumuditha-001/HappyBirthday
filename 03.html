<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Senu...</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        body {
            margin: 0;
            padding: 20px 16px 80px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: manipulation;
            perspective: 1000px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* 1. සුළඟට සෙමින් පැද්දෙන Background ස්තරය */
        .wind-bg {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110vw;
            height: 110vh;
            background-image: url('flower.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            z-index: -2;
            animation: windDriftBg 16s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes windDriftBg {
            0% {
                transform: scale(1) translate(0, 0);
            }
            50% {
                transform: scale(1.04) translate(-1.5%, 1%);
            }
            100% {
                transform: scale(1.02) translate(1.5%, -1%);
            }
        }

        /* 2. සුළඟට ගසාගෙන යන මල් ස්තරය */
        .breeze-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .flower-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            animation: windDriftFlowers 7.5s linear forwards;
        }

        @keyframes windDriftFlowers {
            0% {
                opacity: 0;
                transform: translate(-10vw, 0) rotate(0deg) scale(0.6);
            }
            15% {
                opacity: 0.95;
            }
            50% {
                opacity: 0.95;
                transform: translate(50vw, -14vh) rotate(180deg) scale(1);
            }
            85% {
                opacity: 0.85;
            }
            100% {
                opacity: 0;
                transform: translate(110vw, 8vh) rotate(360deg) scale(0.75);
            }
        }

        /* Fullscreen Heart Transition Overlay */
        .page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
            overflow: hidden;
        }

        .transition-heart {
            position: absolute;
            bottom: -70px;
            user-select: none;
            animation: burstUpSlow 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes burstUpSlow {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 0.2;
            }
            25% {
                opacity: 1;
            }
            100% {
                transform: translateY(-125vh) scale(2.6);
                opacity: 1;
            }
        }

        /* Main Container එක (සියල්ල උඩ සිට පහළට පෙළගැස්වීම) */
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        /* 3. පළමු Image එක සඳහා "Click Me" Attention / Wobble Animation එක */
        .main-btn {
            width: 95px;
            height: 80px;
            cursor: pointer;
            object-fit: cover;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
            animation: clickMeWobble 2.6s infinite ease-in-out;
            transform-origin: center bottom;
            transition: opacity 0.5s ease;
        }

        @keyframes clickMeWobble {
            0%, 100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            15% {
                transform: translateY(-8px) scale(1.08) rotate(-4deg);
            }
            25% {
                transform: translateY(-8px) scale(1.08) rotate(4deg);
            }
            35% {
                transform: translateY(-4px) scale(1.04) rotate(-2deg);
            }
            45% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            70% {
                transform: scale(1.06);
                filter: drop-shadow(0 10px 22px rgba(255, 51, 102, 0.6));
            }
            80% {
                transform: scale(1);
                filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
            }
        }

        .main-btn:hover {
            animation-play-state: paused;
            transform: scale(1.15);
        }

        /* 4. පහළට වැටෙන Photos පෙළගැස්ම */
        .photo-stream {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        /* වැටෙන Photo Card එක */
        .stream-item {
            width: clamp(240px, 80vw, 290px);
            height: clamp(240px, 80vw, 290px);
            overflow: hidden;
            border-radius: 16px;
            opacity: 0;
            transform: translateY(-40px) rotate(-3deg) scale(0.9);
            pointer-events: none;
        }

        .stream-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-stream.active .stream-item {
            animation: dropDownBounce 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            pointer-events: auto;
        }

        .photo-stream.active .stream-item:nth-child(1) { animation-delay: 0.1s; }
        .photo-stream.active .stream-item:nth-child(2) { animation-delay: 0.2s; }
        .photo-stream.active .stream-item:nth-child(3) { animation-delay: 0.3s; }
        .photo-stream.active .stream-item:nth-child(4) { animation-delay: 0.4s; }
        .photo-stream.active .stream-item:nth-child(5) { animation-delay: 0.5s; }
        .photo-stream.active .stream-item:nth-child(6) { animation-delay: 0.6s; }

        @keyframes dropDownBounce {
            0% {
                opacity: 0;
                transform: translateY(-60px) rotate(-6deg) scale(0.75);
            }
            70% {
                opacity: 1;
                transform: translateY(6px) rotate(-1deg) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(-2deg) scale(1);
            }
        }

        /* 5. Photos වලට පහළින් පිහිටන විනිවිද පෙනෙන Glass Text Box එක */
        .glass-note-card {
            width: 95%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 22px 20px;
            box-sizing: border-box;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
            transform-style: preserve-3d;
            margin-top: 25px;
        }

        .glass-note-text {
            color: #4a0e2e;
            font-size: 13.5px;
            line-height: 1.7;
            font-weight: 600;
            margin: 0;
            white-space: pre-wrap;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #ff3366;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blink 0.7s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 3D Swaying Motion */
        .glass-note-card.sway-3d {
            animation: gentle3dSway 5s ease-in-out infinite alternate;
        }

        @keyframes gentle3dSway {
            0% {
                transform: rotateY(-5deg) rotateX(3deg);
                box-shadow: -8px 16px 26px rgba(0, 0, 0, 0.2);
            }
            50% {
                transform: rotateY(0deg) rotateX(-2deg);
                box-shadow: 0 20px 32px rgba(0, 0, 0, 0.24);
            }
            100% {
                transform: rotateY(5deg) rotateX(3deg);
                box-shadow: 8px 16px 26px rgba(0, 0, 0, 0.2);
            }
        }

        /* 6. Next Button එක */
        .btn-next-page {
            display: none;
            margin-top: 25px;
            background-color: #ff3366;
            color: #ffffff;
            border: none;
            padding: 12px 42px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 6px 18px rgba(255, 51, 102, 0.45);
            transition: transform 0.2s, background-color 0.2s;
        }

        .photo-stream.active ~ .btn-next-page {
            display: inline-block;
            animation: fadeInBtn 0.8s ease 0.7s forwards;
        }

        @keyframes fadeInBtn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-next-page:hover {
            background-color: #e62055;
            transform: scale(1.05);
        }
    </style>
</head>

<body id="pageBody">

    <!-- සුළඟට පැද්දෙන Background ස්තරය -->
    <div class="wind-bg"></div>

    <!-- සුළඟේ පාවෙන මල් ස්තරය -->
    <div class="breeze-particles" id="breezeParticles"></div>

    <!-- අඛණ්ඩ පසුබිම් සංගීතය -->
    <audio id="bgMusic" src="H music.mp3" preload="auto" loop></audio>

    <!-- Transition Hearts සඳහා Overlay එක -->
    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <div class="page-container">
        <!-- 1. සෙලවෙමින් "මාව click කරන්න" යැයි අඟවන Main Logo Button එක -->
        <img src="F logo.png" alt="Open Stream" class="main-btn" onclick="dropPhotos()">

        <!-- 2. පහළට වැටෙන ඡායාරූප පෙළ -->
        <div class="photo-stream" id="photoStream">
            <div class="stream-item"><img src="F 1.png" alt="Photo 1"></div>
            <div class="stream-item"><img src="F 4.png" alt="Photo 2"></div>
            <div class="stream-item"><img src="F 3.png" alt="Photo 3"></div>
            <div class="stream-item"><img src="F 2.png" alt="Photo 4"></div>
            <div class="stream-item"><img src="F 5.png" alt="Photo 5"></div>
            <div class="stream-item"><img src="F 6.png" alt="Photo 6"></div>
        </div>

        <!-- 3. Photos වලට පහළින් වැටෙන Glass Text Card එක -->
        <div class="glass-note-card" id="glassNoteCard">
            <p class="glass-note-text"><span id="typewriterText"></span><span class="cursor-blink" id="cursorBlink"></span></p>
        </div>

        <!-- 4. Next Button -->
        <button class="btn-next-page" onclick="goToNextPage()">Next</button>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        // Music Persistence
        window.addEventListener('DOMContentLoaded', () => {
            const savedTime = localStorage.getItem('musicCurrentTime');
            if (savedTime) bgMusic.currentTime = parseFloat(savedTime);

            if (localStorage.getItem('musicPlaying') === 'true') {
                bgMusic.play().catch(() => {});
            }

            startFloralBreeze();
            startTypewriter();
        });

        bgMusic.addEventListener('timeupdate', () => {
            localStorage.setItem('musicCurrentTime', bgMusic.currentTime);
        });

        function ensureMusicPlaying() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    localStorage.setItem('musicPlaying', 'true');
                }).catch(() => {});
            }
        }

        // සුළඟේ ගසාගෙන යන විවිධ මල් වර්ග සජීවීව නිර්මාණය කිරීම
        function startFloralBreeze() {
            const container = document.getElementById('breezeParticles');
            const flowerList = ['🌸', '🌺', '🌷', '🌼', '💐', '🪷', '🌹', '🤍', '🌸'];

            setInterval(() => {
                const flower = document.createElement('div');
                flower.classList.add('flower-item');
                flower.innerText = flowerList[Math.floor(Math.random() * flowerList.length)];

                flower.style.top = (Math.random() * 85 + 5) + 'vh';
                flower.style.fontSize = (Math.random() * 16 + 14) + 'px';
                flower.style.animationDuration = (Math.random() * 3 + 6) + 's';

                container.appendChild(flower);

                setTimeout(() => {
                    flower.remove();
                }, 9000);
            }, 600);
        }

        function dropPhotos() {
            ensureMusicPlaying();
            const stream = document.getElementById("photoStream");
            stream.classList.toggle("active");
        }

        // Typewriter Effect
        const messageToType = `මල් කියන්නේ හරිම ලස්සන මාතෘකාවක්. ඕනෑම තැනකින් පටන් අරගෙන ඕනෑම විදිහකට ඉවර කරන්න පුළුවන්. ඒත් සුදු ඔයා දන්නවද මම කැමතිම දේ...?

මල් කියන්නෙම ගැහැනු ආත්ම...
එක එක මලට වෙනස්ම කතාවක් තියෙනවා. ඒ කතා අතරින් මම වඩාත්ම ආස ඉද්ද මල් වලට. මොකද මගේ ඉද්ද මල ඔයා නිසා... හරිම පිරිසිදු, පිළිවෙළ, චාම් මලක් ඉද්ද කියන්නේ. ඉතින් මම ඔයාව ඒ මලට සමාන කරන එකේ කිසිම වැරැද්දක් නෑනේ...`;

        let charIndex = 0;
        const textElement = document.getElementById('typewriterText');
        const cardElement = document.getElementById('glassNoteCard');
        const cursorElement = document.getElementById('cursorBlink');

        function startTypewriter() {
            function typeNext() {
                if (charIndex < messageToType.length) {
                    textElement.textContent += messageToType.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeNext, 50);
                } else {
                    cursorElement.style.display = 'none';
                    cardElement.classList.add('sway-3d');
                }
            }
            setTimeout(typeNext, 400);
        }

        function goToNextPage() {
            ensureMusicPlaying();
            localStorage.setItem('musicCurrentTime', bgMusic.currentTime);
            localStorage.setItem('musicPlaying', 'true');

            const transitionOverlay = document.getElementById('transitionOverlay');
            const heartIcons = ['❤️', '💖', '💕', '💓', '💗'];
            const totalBurstHearts = 65;

            for (let i = 0; i < totalBurstHearts; i++) {
                const tHeart = document.createElement('div');
                tHeart.classList.add('transition-heart');
                tHeart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                tHeart.style.left = (Math.random() * 100) + 'vw';
                tHeart.style.fontSize = (Math.random() * 32 + 24) + 'px';
                tHeart.style.animationDelay = (Math.random() * 0.5) + 's';
                tHeart.style.animationDuration = (Math.random() * 0.4 + 1.2) + 's';
                transitionOverlay.appendChild(tHeart);
            }

            setTimeout(() => {
                window.location.href = "04.html";
            }, 1400);
        }
    </script>

</body>
</html>
